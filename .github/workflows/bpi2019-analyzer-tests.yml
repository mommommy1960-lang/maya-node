name: BPI 2019 analyzer unit tests
on:
  pull_request:
    paths:
      - 'benchmarks/bpi2019/**'
      - '.github/workflows/bpi2019-analyzer-tests.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/bpi2019/**'
      - '.github/workflows/bpi2019-analyzer-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analyzer fixture tests
        working-directory: benchmarks/bpi2019
        run: python -m unittest -v
