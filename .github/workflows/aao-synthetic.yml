name: AAO synthetic operator checks
on:
  pull_request:
    paths:
      - 'demos/aao_service.py'
      - 'demos/test_aao_service.py'
      - 'demos/aao_academy.py'
      - 'demos/test_aao_academy.py'
      - '.github/workflows/aao-synthetic.yml'
  workflow_dispatch:
jobs:
  synthetic-operator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Verify fail-closed synthetic operator
        run: python -m unittest discover -s demos -p 'test_aao*.py' -v
