name: Aurora Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "aurora/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "aurora/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test and runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q aurora src tests

      - name: Run integration tests
        run: python -m pytest -q
