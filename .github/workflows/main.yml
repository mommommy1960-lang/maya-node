name: Aurora Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "aurora/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "aurora/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q aurora src tests

      - name: Run integration tests
        run: python -m pytest -q
