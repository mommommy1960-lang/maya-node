name: Fail-Closed Security Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and security tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest bandit pip-audit
      - name: Compile all Python
        run: python -m compileall -q aurora src tests
      - name: Tests must pass
        run: python -m pytest -q
      - name: Bandit must pass
        run: bandit -q -r src aurora
      - name: Dependency audit must pass
        run: pip-audit -r requirements.txt
      - name: Reject obvious private-key material
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!docs/security/ADAPTIVE_RED_TEAM_REGISTER.md'; then
            echo 'Private-key material detected in tracked files.' >&2
            exit 1
          fi
