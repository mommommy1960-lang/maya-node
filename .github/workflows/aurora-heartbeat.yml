name: Aurora Heartbeat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aurora_heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate recorded state
        run: |
          test -f aurora.state.json
          python -m json.tool aurora.state.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("aurora.state.json").read_text())
          required = {"version", "status", "lastHeartbeat"}
          missing = sorted(required - state.keys())
          if missing:
              raise SystemExit(f"Missing state fields: {missing}")
          print("Recorded Aurora state is structurally valid.")
          PY
