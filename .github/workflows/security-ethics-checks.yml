# SPDX-License-Identifier: CERL-1.0
name: Security & Ethics Checks

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  adaptive-redteam:
    name: Adaptive Red-Team 100
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install pytest
      - name: Execute 100 enumerated adversarial cases
        run: python -m pytest tests/security/test_adaptive_redteam_100.py -v

  nightwatch-1000:
    name: Nightwatch Contingency 1000
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install pytest
      - name: Execute established 100 plus 900 additional adversarial mutations
        run: python -m pytest tests/security/test_adaptive_redteam_1000.py -v

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install bandit
      - name: Bandit must pass
        run: bandit -r src/ -f txt

  ethics-verification:
    name: Ethics Constraint Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - run: pip install pytest
      - name: Verify CERL headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! grep -q "CERL-1.0" "$file"; then
              echo "Missing CERL header: $file"
              missing=$((missing + 1))
            fi
          done < <(find src/ -type f \( -name "*.py" -o -name "*.js" -o -name "*.ts" \))
          test "$missing" -eq 0
      - name: Run ethics tests fail closed
        run: python -m pytest tests/ethics/ -v

  core-tests:
    name: Core Runtime and Ledger Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Install runtime test dependencies
        run: pip install pytest flask flask-cors
      - name: Runtime tests
        run: python -m pytest tests/runtime/ -v
      - name: Ledger tests
        run: python -m pytest tests/ledger/ -v
