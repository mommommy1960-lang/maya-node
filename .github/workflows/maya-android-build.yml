name: Maya Android App
on:
  push:
    branches: [feature/maya-android-2026-11-04]
    paths: [maya-android/**, .github/workflows/maya-android-build.yml]
  pull_request:
    paths: [maya-android/**, .github/workflows/maya-android-build.yml]
permissions:
  contents: read
concurrency:
  group: maya-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint Android app
        run: gradle -p maya-android :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maya-node-android-demo
          path: maya-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
