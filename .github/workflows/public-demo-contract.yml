name: Public demo contract tests

on:
  push:
    paths:
      - "demos/database_browser_demo.html"
      - "tests/test_database_browser_demo.py"
      - ".github/workflows/public-demo-contract.yml"
  pull_request:
    paths:
      - "demos/database_browser_demo.html"
      - "tests/test_database_browser_demo.py"
      - ".github/workflows/public-demo-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run public demo contract tests
        run: python -m unittest discover -s tests -p "test_database_browser_demo.py" -v
